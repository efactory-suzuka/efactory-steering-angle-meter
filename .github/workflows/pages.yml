name: Verify and deploy Phase 6 measurement
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Install independent Worker dependencies
        run: pnpm --dir worker install --frozen-lockfile
      - name: Test Worker and D1
        run: pnpm --dir worker test
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build browser test fixture (all counter requests mocked)
        run: pnpm build
        env:
          VITE_COUNTER_ENDPOINT: https://counter.example/count
      - name: Run pnpm test:browser
        run: |
          set +e
          pnpm test:browser > /tmp/browser-test.log 2>&1
          result=$?
          cat /tmp/browser-test.log
          exit "$result"
      - name: Report browser test failures
        if: failure()
        run: |
          node --input-type=module <<'NODE'
          import {existsSync, readFileSync, appendFileSync} from 'node:fs';
          const file = 'test-results/browser-results.json';
          if (existsSync(file)) {
            const report = JSON.parse(readFileSync(file, 'utf8'));
            const failures = [];
            function visit(suite) {
              for (const spec of suite.specs ?? []) {
                for (const test of spec.tests) {
                  for (const result of test.results) {
                    if (result.status !== 'passed') {
                      failures.push(spec.title + '\n' + (result.errors ?? []).map(error => error.message).join('\n'));
                    }
                  }
                }
              }
              for (const child of suite.suites ?? []) visit(child);
            }
            for (const suite of report.suites) visit(suite);
            const detail = failures.join('\n\n').replace(/\u001b\[[0-9;]*m/g, '');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Browser test failures\n\n```text\n' + detail + '\n```\n');
            if (detail) console.log('::error title=Browser test failure::' + detail.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));
          } else if (existsSync('/tmp/browser-test.log')) {
            const detail = readFileSync('/tmp/browser-test.log', 'utf8').slice(-12000).replace(/\u001b\[[0-9;]*m/g, '');
            console.log('::error title=Browser runner failure::' + detail.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A'));
          }
          NODE
      - name: Build production Pages artifact
        run: pnpm build
        env:
          VITE_COUNTER_ENDPOINT: ${{ vars.VITE_COUNTER_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
